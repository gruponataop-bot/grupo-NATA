<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Manutenção - NATA</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/cadastro-padrao.css">
    <link rel="stylesheet" href="../css/mostrarAlerta.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/cadastromanutencao.js" defer></script>
    <script src="../js/sidebar.js" defer></script>
    <script src="../js/topbar.js" defer></script>
    <script src="../js/manutencao.js" defer></script>
    <script src="../js/mascaras.js" defer></script>
    <script src="../js/mostrarAlerta.js" defer></script>
</head>
<body data-nav-active="manutencao">
    <div id="alert-container" class="alert-container"></div>
    <div class="layout-app">
        <div id="sidebar-container"></div>

        <div class="conteudo-direito">
            <header class="topbar">
                <div class="topbar-titulo"><h1>Manutenção</h1></div>
                <div class="topbar-usuario">
                    <div class="separador"></div>
                    <span class="saudacao">Olá, <strong id="nome-usuario">carregando...</strong></span>
                </div>
            </header>

            <main class="area-principal">

                <div class="cp-header">
                    <button class="cp-back" onclick="window.location.href='manutencao.html'">
                        <i class="ph ph-caret-left"></i> Voltar
                    </button>
                    <div class="cp-title-block">
                        <h2>Nova Manutenção</h2>
                        <p>Registre um serviço de manutenção para um veículo</p>
                    </div>
                </div>

                <form id="form-nova-manutencao" class="cp-form" novalidate>

                    <div class="cp-card">
                        <div class="cp-card-head">
                            <div class="cp-step">1</div>
                            <span class="cp-section-name">Veículo</span>
                        </div>
                        <div class="cp-card-body">
                            <div class="cp-field">
                                <label>Selecionar veículo</label>
                                <select name="id_veiculo" id="select-veiculo" required>
                                    <option value="">Carregando veículos...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="cp-card">
                        <div class="cp-card-head">
                            <div class="cp-step">2</div>
                            <span class="cp-section-name">Informações do serviço</span>
                        </div>
                        <div class="cp-card-body">
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Tipo de serviço</label>
                                    <select name="tipo" required>
                                        <option value="Preventiva">Preventiva</option>
                                        <option value="Corretiva">Corretiva</option>
                                        <option value="Revisão">Revisão</option>
                                    </select>
                                </div>
                                <div class="cp-field">
                                    <label>Descrição do serviço</label>
                                    <input type="text" name="servico" placeholder="Ex: Troca de óleo" required>
                                </div>
                            </div>
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Data</label>
                                    <input type="date" name="data" required>
                                </div>
                                <div class="cp-field">
                                    <label>Local</label>
                                    <input type="text" name="local" placeholder="Nome da oficina" required>
                                </div>
                            </div>
                            <div class="cp-field" style="max-width:200px;">
                                <label>Custo <span class="cp-hint">(opcional)</span></label>
                                <input type="number" step="0.01" name="custo" placeholder="0,00">
                            </div>
                        </div>
                    </div>

                    <div class="cp-footer">
                        <button type="button" class="cp-btn-cancel" onclick="window.location.href='manutencao.html'">Cancelar</button>
                        <button type="submit" class="cp-btn-submit">
                            <i class="ph ph-check-circle"></i> Registrar Manutenção
                        </button>
                    </div>

                </form>
            </main>
        </div>
    </div>
</body>
</html>
