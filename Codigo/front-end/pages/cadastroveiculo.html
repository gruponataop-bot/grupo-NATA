<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Veículo - NATA</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/cadastro-padrao.css">
    <link rel="stylesheet" href="../css/mostrarAlerta.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/cadastroveiculo.js" defer></script>
    <script src="../js/sidebar.js" defer></script>
    <script src="../js/topbar.js" defer></script>
    <script src="../js/veiculos.js" defer></script>
    <script src="../js/mascaras.js" defer></script>
    <script src="../js/mostrarAlerta.js" defer></script>
</head>
<body data-nav-active="veiculos">
    <div id="alert-container" class="alert-container"></div>

    <div class="layout-app">
        <div id="sidebar-container"></div>

        <div class="conteudo-direito">
            <header class="topbar">
                <div class="topbar-titulo"><h1>Frota</h1></div>
                <div class="topbar-usuario">
                    <div class="separador"></div>
                    <span class="saudacao">Olá, <strong id="nome-usuario">carregando...</strong></span>
                </div>
            </header>

            <main class="area-principal">

                <div class="cp-header">
                    <button class="cp-back" onclick="window.location.href='veiculos.html'">
                        <i class="ph ph-caret-left"></i> Voltar
                    </button>
                    <div class="cp-title-block">
                        <h2>Novo Veículo</h2>
                        <p>Preencha os dados para cadastrar um veículo na frota</p>
                    </div>
                </div>

                <form id="form-novo-veiculo" class="cp-form" novalidate>

                    <div class="cp-card">
                        <div class="cp-card-head">
                            <div class="cp-step">1</div>
                            <span class="cp-section-name">Informações do Veículo</span>
                        </div>
                        <div class="cp-card-body">
                            <div class="cp-field">
                                <label>Tipo</label>
                                <div class="cp-radios">
                                    <label><input type="radio" name="tipo_veiculo" value="Moto"> Moto</label>
                                    <label><input type="radio" name="tipo_veiculo" value="Carro" checked> Carro</label>
                                    <label><input type="radio" name="tipo_veiculo" value="Caminhonete"> Caminhonete</label>
                                </div>
                            </div>
                            <div class="cp-field" style="max-width:200px;">
                                <label>Placa</label>
                                <input type="text" name="placa" placeholder="XXX1X11">
                            </div>
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Marca</label>
                                    <input type="text" name="marca" placeholder="Ex.: Fiat">
                                </div>
                                <div class="cp-field">
                                    <label>Modelo</label>
                                    <input type="text" name="modelo" placeholder="Ex.: Palio">
                                </div>
                            </div>
                            <div class="cp-upload-zone" onclick="document.getElementById('fotoVeiculo').click()">
                                <i class="ph ph-car"></i>
                                <p class="cp-upload-main">Foto do Veículo</p>
                                <p class="cp-upload-sub">Clique para escolher uma imagem <span class="cp-hint">(opcional)</span></p>
                                <p class="cp-upload-fname" id="nome-arquivo"></p>
                            </div>
                            <input type="file" id="fotoVeiculo" name="fotoVeiculo" accept="image/*" style="display:none"
                                onchange="document.getElementById('nome-arquivo').textContent=this.files[0]?.name||'';document.getElementById('nome-arquivo').style.display=this.files[0]?'block':'none'">
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Ano</label>
                                    <input type="year" name="ano">
                                </div>
                                <div class="cp-field">
                                    <label>Carga máxima (kg)</label>
                                    <input type="text" name="cargaMax">
                                </div>
                            </div>
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Km atual</label>
                                    <input type="number" name="km_atual">
                                </div>
                                <div class="cp-field">
                                    <label>Data última revisão</label>
                                    <input type="date" name="dtUltimaRevisao">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="cp-card">
                        <div class="cp-card-head">
                            <div class="cp-step">2</div>
                            <span class="cp-section-name">Informações do Proprietário</span>
                        </div>
                        <div class="cp-card-body">
                            <div class="cp-field">
                                <label>Nome completo</label>
                                <input type="text" name="nome_proprietario">
                            </div>
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Telefone</label>
                                    <input type="text" name="tel_proprietario" placeholder="(XX) XXXXX-XXXX">
                                </div>
                                <div class="cp-field">
                                    <label>E-mail</label>
                                    <input type="email" name="email_proprietario" placeholder="exemplo@dominio.com">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="cp-footer">
                        <button type="button" class="cp-btn-cancel" onclick="window.history.back()">Cancelar</button>
                        <button type="submit" class="cp-btn-submit">
                            <i class="ph ph-check-circle"></i> Cadastrar Veículo
                        </button>
                    </div>

                </form>
            </main>
        </div>
    </div>
</body>
</html>
