<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nata</title>
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="../css/auth-padrao.css" />
  <link rel="stylesheet" href="../css/mostrarAlerta.css">

  <script src="../js/login.js" defer></script>
  <script src="../js/mostrarAlerta.js" defer></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <div id="alert-container" class="alert-container"></div>
  
  <div class="page">
    <header class="topbar">
      <div class="logo">Nata</div>

      <nav class="nav">
        <a href="../index.html">Início</a>
        <a href="../index.html#comunidade">A comunidade</a>
        <a href="../index.html#projetos">Projetos</a>
        <a href="doacoes.html">Doações</a>
        <a href="../index.html#contato">Contato</a>
      </nav>


      <button class="menu-toggle" aria-label="Abrir menu" type="button">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <nav class="mobile-menu" id="mobileMenu">
      <a href="../index.html">Início</a>
      <a href="../index.html#comunidade">A comunidade</a>
      <a href="../index.html#projetos">Projetos</a>
      <a href="doacoes.html">Doações</a>
      <a href="../index.html#contato">Contato</a>
    </nav>

    <main class="content">
      <button class="back-btn" onclick="history.back()">
        <span>←</span>
        VOLTAR
      </button>

      <div class="card-wrapper">
        <section class="login-card">
          <div class="lock-badge">
            <i class="fas fa-lock"></i>
          </div>

          <h1 class="title">FAÇA SEU LOGIN</h1>

          <div class="divider"></div>

          <form id="loginForm">
            <div class="field">
              <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 21a8 8 0 0 0-16 0"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <input type="text" id="usuario" placeholder="E-MAIL" required />
            </div>

            <div class="field" style="margin-bottom: 6px;">
              <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </div>
              <input type="password" id="senha" placeholder="SENHA" required />
              <button type="button" class="password-toggle" id="toggleSenha" aria-label="Mostrar senha"
                aria-pressed="false">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 3l18 18"></path>
                  <path d="M10.6 10.7a2.5 2.5 0 0 0 3 3"></path>
                  <path d="M6.7 6.8C4.3 8.4 2.9 10.8 2 12c1.4 2.4 4.8 6 10 6 2 0 3.8-.5 5.2-1.3"></path>
                  <path d="M14.8 6.3A10.8 10.8 0 0 1 22 12c-.5.8-1.5 2.3-3.1 3.7"></path>
                </svg>
              </button>
            </div>

            <div style="text-align: right; margin-bottom: 18px;">
              <a href="esqueciSenha.html" class="forgot-password" style="margin: 0; font-size: 0.95rem;">
                Esqueceu a senha?
              </a>
            </div>

            <div class="select-wrapper">
              <div class="field">
                <div class="icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="7" r="4"></circle>
                    <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
                  </svg>
                </div>
                <select id="tipoUsuario" required>
                  <option value="">TIPO DE USUÁRIO</option>
                  <option value="professor">Professor</option>
                  <option value="Administrativo">Administrador</option>
                  <option value="Coordenador">Coordenador</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; display: block; margin-top: 10px;">
              ENTRAR
            </button>

          </form>
        </section>
      </div>

      <div class="welcome">
        ♡ Que bom ter você por aqui!
        <small>── ❦ ──</small>
      </div>
    </main>
  </div>
</body>

</html>
