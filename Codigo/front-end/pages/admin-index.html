<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina inicial - NATA</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/cadastro-padrao.css">
    <link rel="stylesheet" href="../css/admin-index.css">
    <link rel="stylesheet" href="../css/mostrarAlerta.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/sidebar.js" defer></script>
    <script src="../js/topbar.js" defer></script>
    <script src="../js/admin-index.js" defer></script>
    <script src="../js/mostrarAlerta.js" defer></script>
</head>

<body data-nav-active="admin-index">
    <div id="alert-container" class="alert-container"></div>
    <div class="layout-app">
        <div id="sidebar-container"></div>

        <div class="conteudo-direito">
            <header class="topbar">
                <div class="topbar-titulo">
                    <h1>Pagina inicial</h1>
                </div>

                <div class="topbar-usuario">
                    <div class="separador"></div>
                    <span class="saudacao">
                        Ola, <strong id="nome-usuario">carregando...</strong>
                    </span>
                </div>
            </header>

            <main class="area-principal">
                <div class="cp-header admin-home-header">
                    <button class="cp-back" onclick="window.location.href='dashboard.html'">
                        <i class="ph ph-caret-left"></i> Voltar
                    </button>
                    <div class="cp-title-block">
                        <h2>Controle da pagina inicial</h2>
                        <p>Escolha os projetos em destaque e atualize os canais de contato exibidos na index.</p>
                    </div>
                </div>

                <form class="cp-form admin-home-form" id="adminHomeForm">
                    <div class="admin-feedback" id="adminHomeFeedback" role="status"></div>

                    <section class="cp-card">
                        <div class="cp-card-head">
                            <div class="cp-step">1</div>
                            <span class="cp-section-name">Projetos exibidos na home</span>
                        </div>
                        <div class="cp-card-body">
                            <div class="admin-toolbar">
                                <span id="projectsLoadStatus">Carregando projetos...</span>
                                <button class="cp-btn-secondary" type="button" id="selectActiveProjects">
                                    <i class="ph ph-check-square"></i> Marcar ativos
                                </button>
                            </div>
                            <div class="admin-project-list" id="adminProjectList"></div>
                        </div>
                    </section>

                    <section class="cp-card">
                        <div class="cp-card-head">
                            <div class="cp-step">2</div>
                            <span class="cp-section-name">Dados de contato</span>
                        </div>
                        <div class="cp-card-body">
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Telefone</label>
                                    <input type="text" id="contactPhone" placeholder="(00) 00000-0000">
                                </div>
                                <div class="cp-field">
                                    <label>E-mail</label>
                                    <input type="email" id="contactEmail" placeholder="contato@nata.org">
                                </div>
                            </div>
                            <div class="cp-grid-2">
                                <div class="cp-field">
                                    <label>Endereco</label>
                                    <input type="text" id="contactAddress" placeholder="Comunidade NATA">
                                </div>
                                <div class="cp-field">
                                    <label>Rede social</label>
                                    <input type="text" id="contactSocial" placeholder="@associacao.nata">
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="cp-footer">
                        <button type="button" class="cp-btn-cancel" onclick="window.open('../index.html', '_blank')">
                            Ver index
                        </button>
                        <button type="submit" class="cp-btn-submit">
                            <i class="ph ph-floppy-disk"></i> Salvar pagina inicial
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>
</body>

</html>
