<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Perfil - Administrativo NATA</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/perfil-administrativo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=DM+Sans:wght@300;400;500;600;700&family=MonteCarlo&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="../js/sidebar.js" defer></script>
    <script src="../js/topbar.js" defer></script>
    <script src="../js/perfil-administrativo.js" defer></script>
    <script src="../js/mascaras.js" defer></script>
</head>

<body data-nav-active="perfil-administrativo">
    <div class="layout-app">
        <div id="sidebar-container"></div>

        <div class="conteudo-direito">
            <header class="topbar">
                <div class="topbar-titulo">
                    <h1>Meu Perfil</h1>
                </div>
                <div class="topbar-usuario">
                    <div class="separador"></div>
                    <span class="saudacao">
                        Olá, <strong id="nome-usuario">carregando...</strong>
                    </span>
                </div>
            </header>

            <main class="perfil-admin-page">
                <section class="perfil-admin-header">
                    <p class="page-kicker">Área administrativa</p>
                    <h2>Dados do funcionário</h2>
                    <p>Visualize e atualize as informações do seu cadastro administrativo.</p>
                </section>

                <section class="perfil-admin-panel">
                    <aside class="profile-summary">
                        <div class="profile-avatar" id="adminIniciais">AD</div>
                        <span class="profile-label">Funcionário administrativo</span>
                        <h3 id="adminNomeResumo">Carregando...</h3>
                        <p id="adminCargoResumo">Administrativo</p>
                    </aside>

                    <form id="formPerfilAdmin" class="profile-form">
                        <input type="hidden" id="adminId">
                        <input type="hidden" id="adminCargo">
                        <input type="hidden" id="adminSenha">

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="adminNome">Nome completo</label>
                                <input type="text" id="adminNome" required>
                            </div>
                            <div class="form-field">
                                <label for="adminCpf">CPF</label>
                                <input type="text" id="adminCpf" required maxlength="14">
                            </div>
                            <div class="form-field">
                                <label for="adminTelefone">Telefone</label>
                                <input type="text" id="adminTelefone" required maxlength="15">
                            </div>
                            <div class="form-field">
                                <label for="adminEmail">E-mail</label>
                                <input type="email" id="adminEmail" required>
                            </div>
                        </div>

                        <div id="perfilAdminFeedback" class="feedback" style="display:none"></div>

                        <div class="profile-actions">
                            <button type="button" class="btn-secondary-profile" onclick="carregarPerfilAdministrativo()">
                                <i class="ph ph-arrow-clockwise"></i> Recarregar
                            </button>
                            <button type="submit" class="btn-primary-profile">
                                <i class="ph ph-floppy-disk"></i> Salvar alterações
                            </button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
