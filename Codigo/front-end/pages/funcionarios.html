<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Funcionários - NATA</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/tabela.css">
    <link rel="stylesheet" href="../css/modal-padrao.css">
    <link rel="stylesheet" href="../css/adicionar.css">
    <link rel="stylesheet" href="../css/mostrarAlerta.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="../js/sidebar.js" defer></script>
    <script src="../js/topbar.js" defer></script>
    <script src="../js/components.js" defer></script>
    <script src="../js/funcionarios.js" defer></script>
    <script src="../js/mascaras.js" defer></script>
    <script src="../js/mostrarAlerta.js" defer></script>
</head>

<body data-nav-active="funcionarios">
    <div id="alert-container" class="alert-container"></div>
    <div class="layout-app">
        <div id="sidebar-container"></div>
        <div class="conteudo-direito">
            <header class="topbar">
                <div class="topbar-titulo">
                    <h1>Funcionários</h1>
                </div>

                <div class="topbar-usuario">
                    <div class="separador"></div>
                    <span class="saudacao">
                        Olá, <strong id="nome-usuario">carregando...</strong>
                    </span>
                </div>
            </header>
            <main class="area-principal">
                <div class="page-header">
                    <div>
                        <p class="page-subtitle">Gerencie o quadro de colaboradores da instituição</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-adicionar" onclick="window.location.href='cadastroFuncionario.html'">
                            <i class="ph ph-plus"></i> Adicionar funcionário
                        </button>
                    </div>
                </div>
                <div class="barra-filtros">
                    <div class="input-grupo pesquisa">
                        <input type="text" id="pesquisa-nome" placeholder="Pesquisar por nome" oninput="pesquisar()">
                        <i class="ph ph-magnifying-glass"></i>
                    </div>
                </div>
                <div class="tabela-container">
                    <table class="tabela-dados">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Email</th>
                                <th>Cargo</th>
                                <th>Telefone</th>
                                <th>ID</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-funcionarios-body">
                        </tbody>
                    </table>
                </div>
                <dialog id="modalEdicao" class="em-dialog">
                    <div class="em-header">
                        <div>
                            <h2 class="em-title">Editar Funcionário</h2>
                            <p class="em-subtitle">Atualize os dados do colaborador</p>
                        </div>
                        <button type="button" class="em-close" onclick="document.getElementById('modalEdicao').close()"><i class="ph ph-x"></i></button>
                    </div>
                    <form id="formEdicao" class="em-body" onsubmit="editarParticipante(event)">
                        <input type="hidden" id="edit-id">
                        <input type="hidden" id="edit-senha">
                        <div class="em-g2">
                            <div class="em-field">
                                <label>Nome Completo</label>
                                <input type="text" id="edit-nome" required>
                            </div>
                            <div class="em-field">
                                <label>CPF</label>
                                <input type="text" id="edit-cpf" required maxlength="14">
                            </div>
                        </div>
                        <div class="em-g3">
                            <div class="em-field">
                                <label>Telefone</label>
                                <input type="text" id="edit-telefone" required maxlength="15">
                            </div>
                            <div class="em-field">
                                <label>Email</label>
                                <input type="email" id="edit-email" required>
                            </div>
                            <div class="em-field">
                                <label>Cargo</label>
                                <select id="edit-cargo" required>
                                    <option value="professor">Professor</option>
                                    <option value="financeiro">Financeiro</option>
                                </select>
                            </div>
                        </div>
                    </form>
                    <div class="em-footer">
                        <button type="button" class="em-btn-cancel" onclick="document.getElementById('modalEdicao').close()">Fechar</button>
                        <button type="submit" form="formEdicao" class="em-btn-save">
                            <i class="ph ph-floppy-disk"></i> Salvar Alterações
                        </button>
                    </div>
                </dialog>

                <dialog id="modalExcluir" class="em-dialog" style="max-width:380px;">
                    <div class="em-confirm-head">
                        <i class="ph ph-warning-circle"></i>
                        <h3>Confirmar Exclusão</h3>
                    </div>
                    <div class="em-confirm-body">
                        Você tem certeza que deseja excluir o funcionário
                        <strong id="nome-excluir-exibicao"></strong>?
                        <input type="hidden" id="id-excluir-oculto">
                    </div>
                    <div class="em-confirm-foot">
                        <button type="button" class="em-confirm-cancel" onclick="document.getElementById('modalExcluir').close()">Cancelar</button>
                        <button type="button" class="em-confirm-delete" onclick="executarExclusao()">
                            <i class="ph ph-trash"></i> Excluir
                        </button>
                    </div>
                </dialog>
            </main>
            <div id="footer-container"></div>
        </div>
    </div>
</body>

</html>
