# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS (SUPABASE)
# ==========================================

# URL limpa, parando logo depois de /postgres
spring.datasource.url=${DATA_URL}
spring.datasource.username=${DATA_USERNAME}
spring.datasource.password=${DATA_PASS}


# ==========================================
# CONFIGURAÇÕES DO HIBERNATE / SPRING DATA
# ==========================================

# Faz o Java criar e atualizar as tabelas no Supabase automaticamente
spring.jpa.hibernate.ddl-auto=update
# Mostra no console os comandos SQL sendo executados
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Informa que estamos usando o PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# CONFIGURAÇÕES DE E-MAIL
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Confia apenas no certificado do servidor SMTP do Gmail
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Link usado no e-mail de redefinicao de senha.
# Em producao, configure APP_FRONTEND_RESET_PASSWORD_URL no Render.
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL:http://127.0.0.1:5500/Codigo/front-end/pages/resetarSenha.html}


# ==========================================
# CONFIGURAÇÕES GETRAK (MOCK)
# ==========================================
getrak.api.url=${GETRAK_API_URL:https://api.getrak.com.br}
getrak.client.id=${GETRAK_CLIENT_ID:}
getrak.client.secret=${GETRAK_CLIENT_SECRET:}
getrak.username=${GETRAK_USERNAME:}
getrak.password=${GETRAK_PASSWORD:}
